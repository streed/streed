name: Update ASCII Solar System

on:
  schedule:
    # Every day at 00:17 UTC. Offset to avoid top-of-hour cron congestion.
    - cron: "17 0 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "scripts/solar_system.py"
      - ".github/workflows/solar-system.yml"

permissions:
  contents: write

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Render solar system
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SOLAR_SYSTEM_USER: ${{ github.repository_owner }}
        run: python scripts/solar_system.py

      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git diff --quiet -- README.md; then
            echo "No orbit changes today."
            exit 0
          fi
          git add README.md
          git commit -m "chore: nudge planets along their orbits"
          git push
